<!-- inventory-search-bar.component.html -->
<div class="search-bar-card">

  <!-- Search Input -->
  <div class="search-group">
    <label class="search-label">{{ 'inventory.search-bar.search-label' | translate }}</label>
    <div class="input-wrapper">
      <mat-icon class="input-icon">search</mat-icon>
      <input
        class="search-input"
        type="text"
        [placeholder]="'inventory.search-bar.search-placeholder' | translate"
        [value]="searchValue()"
        (input)="onSearchChange($event)"
      />
    </div>
  </div>

  <!-- Divider -->
  <div class="search-divider"></div>

  <!-- Category Select -->
  <div class="search-group">
    <label class="search-label">{{ 'inventory.search-bar.category-label' | translate }}</label>
    <div class="input-wrapper">
      <mat-icon class="input-icon">tune</mat-icon>
      <mat-select
        class="category-select"
        [placeholder]="'inventory.search-bar.category-placeholder' | translate"
        [value]="categoryValue()"
        (selectionChange)="onCategoryChange($event.value)"
      >
        <mat-option [value]="null">
          {{ 'inventory.search-bar.category-placeholder' | translate }}
        </mat-option>
        @for (category of categories(); track category.id) {
          <mat-option [value]="category.id">
            @if (getCategoryTranslationKey(category); as categoryKey) {
              {{ categoryKey | translate }}
            } @else {
              {{ category.name }}
            }
          </mat-option>
        }
      </mat-select>
    </div>
  </div>

</div>
