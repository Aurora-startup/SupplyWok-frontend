<section class="supplier-page dashboard-page">
  <header class="supplier-page__header">
    <div class="supplier-page__header-main">
      <p class="supplier-page__kicker">{{ 'supplier-management.dashboard.breadcrumb' | translate }}</p>
      <h1 class="supplier-page__title">{{ 'supplier-management.dashboard.title' | translate }}</h1>
      <span class="supplier-page__subtitle">{{ 'supplier-management.dashboard.subtitle' | translate }}</span>
    </div>
  </header>

  <section class="dashboard-page__stats">
    <app-supplier-dashboard-stat-card icon="pi pi-shopping-bag" [value]="store.ordersCount()" [label]="'supplier-management.dashboard.stats.orders-received' | translate" />
    <app-supplier-dashboard-stat-card icon="pi pi-chart-line" [value]="store.demandOutlook()" [label]="'supplier-management.dashboard.stats.demand-outlook' | translate" />
    <app-supplier-dashboard-stat-card icon="pi pi-bell" [value]="iotStore.openSupplierAlertsCount()" [label]="'supplier-management.dashboard.stats.urgent-requests' | translate" [badge]="'supplier-management.dashboard.stats.alert-badge' | translate" severity="danger" />
  </section>

  <section class="dashboard-page__panels">
    <app-supplier-orders-card
      [title]="'supplier-management.dashboard.orders.title' | translate"
      [caption]="'supplier-management.dashboard.orders.caption' | translate: { count: store.ordersCount() }"
      [orders]="store.orders()"
      [emptyText]="'supplier-management.dashboard.orders.empty' | translate"
    />
    <app-supplier-aggregate-forecast-card
      [title]="'supplier-management.dashboard.aggregate.title' | translate"
      [summary]="'supplier-management.dashboard.aggregate.summary' | translate: { from: aggregateFirstValue(), to: aggregateLastValue() }"
      [series]="aggregateSeries()"
      [emptyText]="'supplier-management.dashboard.aggregate.empty' | translate"
    />
  </section>
</section>
